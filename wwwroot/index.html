    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

</head>

<body>
    <div id="app">
       
        <div class="app-loader">

            <div class="loader-container">

                <div class="loader-brand">

                    <img src="images/logos/logo-reconciliation.png" alt="Reconciliation Logo">

                    <div class="brand-text">
                        <h2>Reconciliation</h2>
                        <span>Financial Management Platform</span>
                    </div>

                </div>

                <div class="loader-animation">
                    <div class="spinner-ring"></div>
                </div>

                <div class="loader-message">
                    <h5>Loading Application</h5>
                    <p>Please wait while we securely prepare your workspace...</p>
                </div>

                <div class="loader-progress">
                    <div class="loader-progress-bar"></div>
                </div>

            </div>

        </div>
    </div>


    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="./js/config.js"></script>

    <script src="./js/pages/form-date-range-picker.js"></script>
    <script src="./plugins/lucide/lucide.min.js"></script>

    <script src="./js/app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/dropzone@5/dist/min/dropzone.min.css" />
    <script src="https://unpkg.com/dropzone@5/dist/min/dropzone.min.js"></script>


    <script src="js/pages/form-fileupload.js"></script>
    <!-- FilePond CSS -->
    <link href="https://unpkg.com/filepond@^4/dist/filepond.css" rel="stylesheet" />
    <!-- FilePond JS -->
    <script src="https://unpkg.com/filepond@^4/dist/filepond.js"></script>
    <script>
        if (typeof FilePond !== 'undefined') {
            // Register image preview plugin if loaded
            if (typeof FilePondPluginImagePreview !== 'undefined') {
                FilePond.registerPlugin(FilePondPluginImagePreview);
            }
        }
        window.initFlatpickr = function () {
            flatpickr('.flatpickr', {
                dateFormat: "Y-m-d",
                allowInput: true,
                onChange: function (selectedDates, dateStr, instance) {
                    // This will trigger Blazor's @bind update
                    const event = new Event('input', {
                        bubbles: true
                    });
                    instance.input.dispatchEvent(event);
                }
            });
        };

        window.updateFlatpickrValues = function (fromDate, toDate) {
            const inputs = document.querySelectorAll('.flatpickr');
            if (inputs.length >= 2) {
                if (fromDate && inputs[0]._flatpickr) {
                    inputs[0]._flatpickr.setDate(fromDate, false);
                }
                if (toDate && inputs[1]._flatpickr) {
                    inputs[1]._flatpickr.setDate(toDate, false);
                }
            }
        };
    </script>
</body>

</html>
