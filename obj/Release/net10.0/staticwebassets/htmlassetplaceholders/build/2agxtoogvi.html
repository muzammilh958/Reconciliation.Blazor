    <script>
         (function() {
         
            // Get the token from localStorage
            const token = localStorage.getItem('authToken');
            
            // Get current path
            const currentPath = window.location.pathname;
            
            // List of public pages that don't require authentication
            const publicPages = ['/', '/login', '/signup', '/forgot-password', '/reset-password'];
            
            // Check if user is logged in and trying to access login page
            if (token && token !== '' && token !== 'null' && token !== 'undefined') {
               
                // If on login page or root, redirect to dashboard
                if (currentPath === '/' || currentPath === '/login' || currentPath === '') {
                    // window.location.href = '/dashboard';
                    return;
                }
            } else {
                console.log('No token found');
                
                // If not logged in and trying to access protected page, redirect to login
                if (!publicPages.includes(currentPath) && currentPath !== '/') {
                    console.log('Redirecting to login...');
                    // window.location.href = '/';
                    return;
                }
            }
            
        })();
        if (typeof FilePond !== 'undefined') {
            // Register image preview plugin if loaded
            if (typeof FilePondPluginImagePreview !== 'undefined') {
                FilePond.registerPlugin(FilePondPluginImagePreview);
            }
        }
        window.initFlatpickr = function () {
            flatpickr('.flatpickr', {
                dateFormat: "Y-m-d",
                allowInput: true,
                onChange: function (selectedDates, dateStr, instance) {
                    // This will trigger Blazor's @bind update
                    const event = new Event('input', {
                        bubbles: true
                    });
                    instance.input.dispatchEvent(event);
                }
            });
        };

        window.updateFlatpickrValues = function (fromDate, toDate) {
            const inputs = document.querySelectorAll('.flatpickr');
            if (inputs.length >= 2) {
                if (fromDate && inputs[0]._flatpickr) {
                    inputs[0]._flatpickr.setDate(fromDate, false);
                }
                if (toDate && inputs[1]._flatpickr) {
                    inputs[1]._flatpickr.setDate(toDate, false);
                }
            }
        };
    </script>
